<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <title>CRM GOTEC PWA</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/logo.svg" />
  <link rel="stylesheet" href="./css/tailwind.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-screen-md mx-auto pb-24">
    <header class="sticky top-0 bg-slate-50/90 backdrop-blur border-b border-slate-200 px-4 py-3 flex items-center justify-between">
      <div>
        <p class="text-xs uppercase tracking-widest text-slate-500">CRM GOTEC</p>
        <h1 id="page-title" class="text-xl font-semibold">Dashboard</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="network-status" class="text-xs font-medium px-2 py-1 rounded-full bg-emerald-100 text-emerald-700">Online</span>
        <button id="login-button" class="text-sm px-3 py-2 rounded-lg bg-slate-900 text-white">Login Google</button>
      </div>
    </header>

    <main id="view-container" class="px-4 py-4"></main>
  </div>

  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 shadow-lg">
    <div class="max-w-screen-md mx-auto grid grid-cols-5 text-center text-xs">
      <a data-route="#/dashboard-gestao" class="nav-item py-3 flex flex-col items-center gap-1 text-slate-500">
        <span class="text-lg">🏠</span>
        <span>Dashboard</span>
      </a>
      <a data-route="#/pipeline" class="nav-item py-3 flex flex-col items-center gap-1 text-slate-500">
        <span class="text-lg">📊</span>
        <span>Pipeline</span>
      </a>
      <a data-route="#/clientes" class="nav-item py-3 flex flex-col items-center gap-1 text-slate-500">
        <span class="text-lg">🏭</span>
        <span>Clientes</span>
      </a>
      <a data-route="#/propostas" class="nav-item py-3 flex flex-col items-center gap-1 text-slate-500">
        <span class="text-lg">📁</span>
        <span>Propostas</span>
      </a>
      <a data-route="#/perfil" class="nav-item py-3 flex flex-col items-center gap-1 text-slate-500">
        <span class="text-lg">⚙️</span>
        <span>Perfil</span>
      </a>
    </div>
  </nav>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
